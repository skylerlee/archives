{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
<div class="page-navs">
  {{ if $paginator.HasPrev }}
    <a class="page-link" href="{{ $paginator.Prev.URL }}">Previous</a>
  {{ else }}
    <span class="page-link disabled">Previous</span>
  {{ end }}
  <span class="page-meter">
    <input id="page-cursor" type="number" value="{{ $paginator.PageNumber }}"
        min="1" max="{{ $paginator.TotalPages }}" aria-label="Current page">
    / {{ $paginator.TotalPages }}
  </span>
  {{ if $paginator.HasNext }}
    <a class="page-link" href="{{ $paginator.Next.URL }}">Next</a>
  {{ else }}
    <span class="page-link disabled">Next</span>
  {{ end }}
</div>
{{ end }}
