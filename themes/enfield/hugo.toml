baseURL = '/'
languageCode = 'en-US'
title = 'Enfield'

[params]
  tagline = 'Enfield'
  description = 'theme for hugo'
  github_repo = 'https://github.com'

[outputs]
  home = ["html"]

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20

  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'
